[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = True

# These narrow overrides record pre-existing typing debt. New modules remain
# strictly checked, and these exceptions should be removed as the adapters are
# refactored around shared typed request models.
[mypy-ukb.ai.providers.noop]
disable_error_code = arg-type

[mypy-ukb.services.context_pack]
disable_error_code = no-any-return

[mypy-ukb.mcp.server]
disable_error_code = arg-type
