services:
  api:
    build: .
    container_name: unified-knowledge-base-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./.ukb:/app/.ukb

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: unified-knowledge-base-web
    ports:
      - "5173:5173"
    environment:
      - VITE_UKB_API_BASE_URL=http://localhost:8000
    depends_on:
      - api

