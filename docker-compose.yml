services:
  api:
    build: .
    container_name: unified-knowledge-base-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Inside Docker Compose, the API reaches Ollama by service name.
      - UKB_AI_PROVIDER=ollama
      - UKB_AI_MODE=local_ai
      - UKB_AI_BASE_URL=http://ollama:11434
      - UKB_AI_CHAT_MODEL=${UKB_AI_CHAT_MODEL:-llama3.1}
      - UKB_AI_EMBEDDING_MODEL=${UKB_AI_EMBEDDING_MODEL:-embeddinggemma}
    volumes:
      - ./.ukb:/app/.ukb
    depends_on:
      - ollama

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: unified-knowledge-base-web
    ports:
      - "5173:5173"
    environment:
      - VITE_UKB_API_BASE_URL=http://localhost:8000
    depends_on:
      - api

  ollama:
    image: ollama/ollama:latest
    container_name: unified-knowledge-base-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama

volumes:
  ollama-models:

