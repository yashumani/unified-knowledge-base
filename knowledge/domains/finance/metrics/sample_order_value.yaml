id: finance.metric.sample_order_value
type: Metric
name: Sample Order Value
domain: finance
owner: Demo Analytics
status: approved
sensitivity: internal
definition: Revenue generated from device sales, excluding service revenue.
formula: SUM(sample_order_amount) excluding returns and test orders.
grain: monthly
source_systems:
