name: Continuous Integration

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python quality and tests
    runs-on: ubuntu-latest
    env:
      UKB_AI_ENRICHMENT_ENABLED: "true"
      UKB_AI_MODE: offline_no_model
      UKB_AI_PROVIDER: noop
      UKB_AI_CHAT_MODEL: deterministic

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp]"

      - name: Ruff
        run: ruff check src tests

      - name: Mypy
        run: mypy src/ukb

      - name: Pytest with coverage
        run: pytest -q --cov=ukb --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Compile Python sources
        run: python -m compileall -q src tests

  frontend:
    name: Frontend and starter-kit build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build React UI
        run: npm run web:build

      - name: Validate brain generator syntax
        run: node --check packages/create-ukb-brain/bin/create-ukb-brain.mjs

      - name: Generate an offline brain project
        run: |
          TARGET="$(mktemp -d)/ci-brain"
          npm run create-brain -- "$TARGET" --offline
          test -f "$TARGET/brain.config.yaml"
          test -d "$TARGET/domains"
          test -d "$TARGET/plugins"

  containers:
    name: Container and Compose validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare environment files
        run: |
          cp .env.example .env
          cp deploy/prod.env.example deploy/.env

      - name: Validate local Compose configuration
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate production Compose configuration
        run: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env config --quiet

      - name: Build API image
        run: docker build --tag ukb-api:ci --file Dockerfile .

      - name: Build web image
        run: docker build --tag ukb-web:ci --file apps/web/Dockerfile .
