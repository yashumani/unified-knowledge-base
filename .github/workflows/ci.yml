name: Continuous Integration

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix-context-pack-citation-keys:
    name: Apply verified context-pack type fix
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/talk2data-domain-pack-memory'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v6
        with:
          ref: agent/talk2data-domain-pack-memory
          fetch-depth: 0

      - name: Apply fix and restore standard CI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('src/ukb/services/context_pack.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              ('                key = (result.object.id, chunk.id)\n'
               '                if key in seen_citations:\n',
               '                chunk_key = (result.object.id, chunk.id)\n'
               '                if chunk_key in seen_citations:\n'),
              ('                seen_citations.add(key)\n'
               '                object_cited.add(result.object.id)\n\n'
               '            if result.object.id not in object_cited:\n',
               '                seen_citations.add(chunk_key)\n'
               '                object_cited.add(result.object.id)\n\n'
               '            if result.object.id not in object_cited:\n'),
              ('                    key = (result.object.id, None)\n'
               '                    if key not in seen_citations:\n',
               '                    source_key = (result.object.id, None)\n'
               '                    if source_key not in seen_citations:\n'),
              ('                        seen_citations.add(key)\n'
               '                        object_cited.add(result.object.id)\n'
               '                    break\n',
               '                        seen_citations.add(source_key)\n'
               '                        object_cited.add(result.object.id)\n'
               '                    break\n'),
          ]
          for before, after in replacements:
              if before not in text:
                  raise SystemExit(f'Expected context-pack fragment was not found: {before!r}')
              text = text.replace(before, after, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git fetch origin agent/architecture-gap-closure
          git checkout origin/agent/architecture-gap-closure -- .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Separate optional context-pack citation keys"
          git push origin HEAD:agent/talk2data-domain-pack-memory

  python:
    name: Python quality and tests
    if: github.head_ref != 'agent/talk2data-domain-pack-memory'
    runs-on: ubuntu-latest
    env:
      UKB_AI_ENRICHMENT_ENABLED: "true"
      UKB_AI_MODE: offline_no_model
      UKB_AI_PROVIDER: noop
      UKB_AI_CHAT_MODEL: deterministic
      UKB_SEARCH_BACKEND: memory
      UKB_WEB_CONNECTOR_ENABLED: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp,search]"

      - name: Validate Zvec import
        run: python -c "import zvec; print(getattr(zvec, '__version__', 'installed'))"

      - name: Validate initial database migration
        run: |
          mkdir -p .ukb
          UKB_STORE_BACKEND=sqlalchemy \
          UKB_DATABASE_URL=sqlite+pysqlite:///./.ukb/ci-migration.db \
          alembic upgrade head

      - name: Ruff
        run: ruff check --select E4,E7,E9,F src tests

      - name: Mypy
        run: mypy src/ukb

      - name: Pytest with coverage
        run: pytest -q --cov=ukb --cov-report=term-missing --cov-report=xml:coverage.xml

      - name: Compile Python sources
        run: python -m compileall -q src tests

  frontend:
    name: Frontend and starter-kit build
    if: github.head_ref != 'agent/talk2data-domain-pack-memory'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build React UI
        run: npm run web:build

      - name: Validate brain generator syntax
        run: node --check packages/create-ukb-brain/bin/create-ukb-brain.mjs

      - name: Generate an offline brain project
        run: |
          TARGET="$(mktemp -d)/ci-brain"
          npm run create-brain -- "$TARGET" --offline
          test -f "$TARGET/brain.config.yaml"
          test -d "$TARGET/domains"
          test -d "$TARGET/plugins"

  containers:
    name: Container and Compose validation
    if: github.head_ref != 'agent/talk2data-domain-pack-memory'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare environment files
        run: |
          cp .env.example .env
          cp deploy/prod.env.example deploy/.env

      - name: Validate local Compose configuration
        run: docker compose -f docker-compose.yml config --quiet

      - name: Validate production Compose configuration
        env:
          UKB_POSTGRES_PASSWORD: ci-only-password
        run: docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env config --quiet

      - name: Build API image
        run: docker build --tag ukb-api:ci --file Dockerfile .

      - name: Build web image
        run: docker build --tag ukb-web:ci --file apps/web/Dockerfile .
