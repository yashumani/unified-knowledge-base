# Deploy the UKB runtime on a machine you control through a GitHub self-hosted runner.
# GitHub is the deployment control plane; the API, PostgreSQL, and Ollama run on the private host.
name: Deploy UKB runtime on self-hosted runner

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "API image tag to deploy from GHCR. Use latest, a commit SHA, or a release tag."
        required: true
        default: "latest"
        type: string
      deploy_path:
        description: "Directory on the self-hosted runner where Compose files and runtime .env live."
        required: true
        default: "/opt/unified-knowledge-base"
        type: string

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: [self-hosted, linux, ukb]
    env:
      UKB_API_IMAGE: ghcr.io/${{ github.repository_owner }}/unified-knowledge-base-api:${{ inputs.image_tag }}
      UKB_DEPLOY_PATH: ${{ inputs.deploy_path }}

    steps:
      - name: Checkout deployment assets
        uses: actions/checkout@v6

      - name: Verify Docker Compose is available
        run: |
          docker version
          docker compose version

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Prepare deployment directory
        run: |
          sudo mkdir -p "${UKB_DEPLOY_PATH}"
          sudo chown "$(id -u):$(id -g)" "${UKB_DEPLOY_PATH}"
          cp deploy/docker-compose.prod.yml "${UKB_DEPLOY_PATH}/docker-compose.yml"
          if [ ! -f "${UKB_DEPLOY_PATH}/.env" ]; then
            cp deploy/prod.env.example "${UKB_DEPLOY_PATH}/.env"
            echo "Created ${UKB_DEPLOY_PATH}/.env. Populate its blank secret values before production use."
            exit 1
          fi

      - name: Validate runtime configuration
        working-directory: ${{ inputs.deploy_path }}
        run: |
          test -n "$(grep '^UKB_API_TOKEN=' .env | cut -d= -f2-)"
          test -n "$(grep '^UKB_POSTGRES_PASSWORD=' .env | cut -d= -f2-)"
          UKB_API_IMAGE="${UKB_API_IMAGE}" docker compose --env-file .env config --quiet

      - name: Pull runtime images
        working-directory: ${{ inputs.deploy_path }}
        run: UKB_API_IMAGE="${UKB_API_IMAGE}" docker compose --env-file .env pull

      - name: Start private dependencies
        working-directory: ${{ inputs.deploy_path }}
        run: |
          UKB_API_IMAGE="${UKB_API_IMAGE}" docker compose --env-file .env up -d postgres ollama
          for attempt in $(seq 1 24); do
            if docker compose --env-file .env exec -T postgres pg_isready -U ukb -d ukb; then
              exit 0
            fi
            sleep 5
          done
          echo "PostgreSQL did not become ready."
          exit 1

      - name: Apply database migrations
        working-directory: ${{ inputs.deploy_path }}
        run: |
          UKB_API_IMAGE="${UKB_API_IMAGE}" docker compose --env-file .env run --rm --no-deps api alembic upgrade head

      - name: Start or update UKB API
        working-directory: ${{ inputs.deploy_path }}
        run: |
          UKB_API_IMAGE="${UKB_API_IMAGE}" docker compose --env-file .env up -d api
          docker compose --env-file .env ps

      - name: Verify governed API
        working-directory: ${{ inputs.deploy_path }}
        run: |
          for attempt in $(seq 1 12); do
            if docker compose --env-file .env exec -T api python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8000/health', timeout=10).read().decode())"; then
              docker compose --env-file .env exec -T api python -c "import urllib.request; print(urllib.request.urlopen('http://localhost:8000/ai/providers', timeout=10).read().decode())"
              exit 0
            fi
            sleep 5
          done
          echo "UKB API health check failed."
          docker compose --env-file .env logs api
          exit 1
