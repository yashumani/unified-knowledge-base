name: Deploy UKB private runtime pilot

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable API image tag, such as v0.4.0 or a commit SHA."
        required: true
        default: "v0.4.0"
        type: string
      deploy_path:
        description: "Deployment directory on the self-hosted Linux runner."
        required: true
        default: "/opt/unified-knowledge-base-staging"
        type: string
      expected_ui_origin:
        description: "HTTPS UI origin that must be allowed by CORS."
        required: true
        default: "https://yashumani.github.io"
        type: string
      bootstrap_models:
        description: "Pull the configured Ollama chat and embedding models."
        required: true
        default: false
        type: boolean
      require_oidc:
        description: "Fail unless OIDC issuer, audience, and JWKS are configured."
        required: true
        default: false
        type: boolean
      require_graphiti:
        description: "Fail unless the Graphiti projection is configured."
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  packages: read
  issues: write

jobs:
  deploy:
    runs-on: [self-hosted, linux, ukb]
    environment: ukb-staging
    timeout-minutes: 45
    env:
      UKB_API_IMAGE: ghcr.io/${{ github.repository_owner }}/unified-knowledge-base-api:${{ inputs.image_tag }}
      UKB_DEPLOY_PATH: ${{ inputs.deploy_path }}

    steps:
      - name: Checkout deployment assets
        uses: actions/checkout@v6

      - name: Set up validation Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install readiness dependencies
        run: python -m pip install "pydantic>=2.8.0" "httpx>=0.27.0"

      - name: Verify Docker Compose
        run: |
          docker version
          docker compose version

      - name: Log in to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Prepare deployment directory
        run: |
          sudo mkdir -p "${UKB_DEPLOY_PATH}"
          sudo chown "$(id -u):$(id -g)" "${UKB_DEPLOY_PATH}"
          cp deploy/docker-compose.prod.yml "${UKB_DEPLOY_PATH}/docker-compose.yml"
          if [ ! -f "${UKB_DEPLOY_PATH}/.env" ]; then
            cp deploy/staging.env.example "${UKB_DEPLOY_PATH}/.env"
            echo "A staging .env template was created at ${UKB_DEPLOY_PATH}/.env."
            echo "Replace every placeholder and rerun this workflow."
            exit 1
          fi

      - name: Validate resolved staging configuration
        shell: bash
        run: |
          VALIDATION_ENV="$(mktemp)"
          cp "${UKB_DEPLOY_PATH}/.env" "${VALIDATION_ENV}"
          if grep -q '^UKB_API_IMAGE=' "${VALIDATION_ENV}"; then
            sed -i "s|^UKB_API_IMAGE=.*|UKB_API_IMAGE=${UKB_API_IMAGE}|" "${VALIDATION_ENV}"
          else
            printf '\nUKB_API_IMAGE=%s\n' "${UKB_API_IMAGE}" >> "${VALIDATION_ENV}"
          fi

          ARGS=(
            --env-file "${VALIDATION_ENV}"
            --expected-ui-origin "${{ inputs.expected_ui_origin }}"
            --output "${UKB_DEPLOY_PATH}/staging-config-report.json"
          )
          if [ "${{ inputs.require_oidc }}" = "true" ]; then
            ARGS+=(--require-oidc)
          fi
          if [ "${{ inputs.require_graphiti }}" = "true" ]; then
            ARGS+=(--require-graphiti)
          fi
          PYTHONPATH="${GITHUB_WORKSPACE}/src" \
            python scripts/validate_staging_readiness.py "${ARGS[@]}"
          rm -f "${VALIDATION_ENV}"

      - name: Pull runtime images
        working-directory: ${{ inputs.deploy_path }}
        run: UKB_API_IMAGE="${UKB_API_IMAGE}" docker compose --env-file .env pull

      - name: Start private dependencies
        working-directory: ${{ inputs.deploy_path }}
        run: |
          UKB_API_IMAGE="${UKB_API_IMAGE}" \
            docker compose --env-file .env up -d postgres ollama crawl4ai
          for attempt in $(seq 1 40); do
            if docker compose --env-file .env exec -T postgres \
              sh -c 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'; then
              exit 0
            fi
            sleep 3
          done
          docker compose --env-file .env logs postgres
          exit 1

      - name: Apply database migrations
        working-directory: ${{ inputs.deploy_path }}
        run: |
          UKB_API_IMAGE="${UKB_API_IMAGE}" \
            docker compose --env-file .env run --rm --no-deps api alembic upgrade head

      - name: Start governed API
        working-directory: ${{ inputs.deploy_path }}
        run: |
          UKB_API_IMAGE="${UKB_API_IMAGE}" docker compose --env-file .env up -d api
          docker compose --env-file .env ps

      - name: Pull configured Ollama models
        if: ${{ inputs.bootstrap_models }}
        working-directory: ${{ inputs.deploy_path }}
        shell: bash
        run: |
          CHAT_MODEL="$(grep -E '^UKB_AI_CHAT_MODEL=' .env | tail -1 | cut -d= -f2-)"
          EMBEDDING_MODEL="$(grep -E '^UKB_AI_EMBEDDING_MODEL=' .env | tail -1 | cut -d= -f2-)"
          docker exec ukb-ollama ollama pull "${CHAT_MODEL:-llama3.1}"
          docker exec ukb-ollama ollama pull "${EMBEDDING_MODEL:-embeddinggemma}"

      - name: Verify API readiness
        working-directory: ${{ inputs.deploy_path }}
        shell: bash
        run: |
          API_PORT="$(grep -E '^UKB_API_PORT=' .env | tail -1 | cut -d= -f2-)"
          API_PORT="${API_PORT:-8000}"
          for attempt in $(seq 1 40); do
            if curl --fail --silent "http://127.0.0.1:${API_PORT}/ready" \
              > /tmp/ukb-ready.json; then
              cat /tmp/ukb-ready.json
              exit 0
            fi
            sleep 3
          done
          docker compose --env-file .env logs api
          exit 1

      - name: Run read-only staging acceptance probes
        working-directory: ${{ inputs.deploy_path }}
        shell: bash
        run: |
          API_PORT="$(grep -E '^UKB_API_PORT=' .env | tail -1 | cut -d= -f2-)"
          API_PORT="${API_PORT:-8000}"
          export UKB_API_TOKEN="$(
            PYTHONPATH="${GITHUB_WORKSPACE}/src" python - <<'PY'
          from ukb.operations.staging import load_env_file
          print(load_env_file(".env")["UKB_API_TOKEN"])
          PY
          )"
          PYTHONPATH="${GITHUB_WORKSPACE}/src" \
            python "${GITHUB_WORKSPACE}/scripts/run_staging_acceptance.py" \
              --base-url "http://127.0.0.1:${API_PORT}" \
              --token-env UKB_API_TOKEN \
              --output staging-acceptance-report.json

      - name: Upload staging evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ukb-staging-pilot-${{ github.run_id }}
          path: |
            ${{ inputs.deploy_path }}/staging-config-report.json
            ${{ inputs.deploy_path }}/staging-acceptance-report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Record staging deployment result
        if: always()
        uses: actions/github-script@v8
        env:
          DEPLOY_RESULT: ${{ job.status }}
          IMAGE: ${{ env.UKB_API_IMAGE }}
          DEPLOY_PATH: ${{ inputs.deploy_path }}
        with:
          script: |
            const body = [
              `## Private runtime pilot — ${context.sha}`,
              '',
              `- Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- Result: **${process.env.DEPLOY_RESULT}**`,
              `- API image: ${process.env.IMAGE}`,
              `- Runner deployment path: \`${process.env.DEPLOY_PATH}\``,
              '- Evidence: workflow artifact containing the redacted configuration and runtime probe reports',
              '- GitHub Pages deployment: unchanged by this workflow',
              '',
              'The runtime is accepted only when configuration validation, migrations, readiness, and every read-only probe succeed.'
            ].join('\n');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 19,
              body
            });
