# Deploy the UKB runtime on a machine you control through a GitHub self-hosted runner.
# This does not make GitHub host the backend or Ollama; it uses GitHub Actions as the deployment control plane.
name: Deploy UKB runtime on self-hosted runner

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "API image tag to deploy from GHCR. Use latest, a commit SHA, or a release tag."
        required: true
        default: "latest"
        type: string
      deploy_path:
        description: "Directory on the self-hosted runner where Compose files and runtime .env live."
        required: true
        default: "/opt/unified-knowledge-base"
        type: string

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    # Configure your runner with labels: self-hosted, linux, ukb.
    runs-on: [self-hosted, linux, ukb]
    env:
      UKB_API_IMAGE: ghcr.io/${{ github.repository_owner }}/unified-knowledge-base-api:${{ inputs.image_tag }}
      UKB_DEPLOY_PATH: ${{ inputs.deploy_path }}

    steps:
      - name: Checkout deployment assets
        uses: actions/checkout@v4

      - name: Verify Docker Compose is available
        run: |
          docker version
          docker compose version

      - name: Log in to GHCR for private/package-protected images
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Prepare deployment directory
        run: |
          sudo mkdir -p "${UKB_DEPLOY_PATH}"
          sudo chown "$(id -u):$(id -g)" "${UKB_DEPLOY_PATH}"
          cp deploy/docker-compose.prod.yml "${UKB_DEPLOY_PATH}/docker-compose.yml"
          if [ ! -f "${UKB_DEPLOY_PATH}/.env" ]; then
            cp deploy/prod.env.example "${UKB_DEPLOY_PATH}/.env"
            echo "Created ${UKB_DEPLOY_PATH}/.env from deploy/prod.env.example. Review it before production use."
          fi

      - name: Pull API and Ollama images
        working-directory: ${{ inputs.deploy_path }}
        run: |
          UKB_API_IMAGE="${UKB_API_IMAGE}" docker compose --env-file .env pull

      - name: Start or update UKB runtime
        working-directory: ${{ inputs.deploy_path }}
        run: |
          UKB_API_IMAGE="${UKB_API_IMAGE}" docker compose --env-file .env up -d
          docker compose ps

      - name: Show runtime checks
        working-directory: ${{ inputs.deploy_path }}
        run: |
          echo "UKB API should be reachable on the configured UKB_API_PORT."
          echo "Ollama is intentionally private on the Compose network and is not published to the internet."
