name: Export current main source

on:
  push:
    branches:
      - agent/slideshow-main-export
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main snapshot
        uses: actions/checkout@v4
      - name: Create source archive
        run: tar --exclude=.git --exclude=node_modules -czf /tmp/ukb-current-main.tar.gz .
      - name: Upload current main source
        uses: actions/upload-artifact@v4
        with:
          name: ukb-current-main-source
          path: /tmp/ukb-current-main.tar.gz
          retention-days: 1
      - name: Report artifact run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "${{ github.repository }}" \
            --title "Current main export ready in run ${{ github.run_id }}" \
            --body "Download artifact **ukb-current-main-source** from run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}."
