name: Apply Talk2Data implementation bundle

on:
  push:
    branches:
      - agent/talk2data-domain-pack-memory
    paths:
      - "scripts/.talk2data-bootstrap.part*"
      - ".github/workflows/talk2data-bootstrap.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/talk2data-domain-pack-memory
          fetch-depth: 0

      - name: Extract verified implementation
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/.talk2data-bootstrap.part* > /tmp/bundle.b64
          base64 --decode /tmp/bundle.b64 > /tmp/bundle.tar.gz
          echo "0cf28d045773ad2c5b866914f14993679a6a0230b1a6d282125b435a929b0285  /tmp/bundle.tar.gz" | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          import tarfile

          root = Path.cwd().resolve()
          with tarfile.open("/tmp/bundle.tar.gz", "r:gz") as archive:
              for member in archive.getmembers():
                  target = (root / member.name).resolve()
                  if target != root and root not in target.parents:
                      raise SystemExit(f"Unsafe archive member: {member.name}")
              archive.extractall(root)
          PY
          rm -f scripts/.talk2data-bootstrap.part* .github/workflows/talk2data-bootstrap.yml

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement Talk2Data Domain Pack and governed memory contract"
          git push origin HEAD:agent/talk2data-domain-pack-memory
