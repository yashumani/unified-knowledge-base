name: Repair and verify governed runtime v0.7

on:
  pull_request:
    paths:
      - ".github/workflows/repair-v07-runtime.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest v0.7 branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply remaining deterministic patches
        run: |
          if [ -f scripts/finish_v07_patch.py ]; then
            python scripts/finish_v07_patch.py
          fi
          python <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          service = root / 'src/ukb/governed_runtime/service.py'
          text = service.read_text(encoding='utf-8')
          text = text.replace('import hashlib\n', '')
          text = text.replace(
              'from ukb.governed_runtime.cache import CacheCoordinator, canonical_json, digest_payload',
              'from ukb.governed_runtime.cache import CacheCoordinator, digest_payload',
          )
          service.write_text(text, encoding='utf-8')

          server = root / 'src/ukb/mcp/server.py'
          text = server.read_text(encoding='utf-8')
          old = '''def _build_fastmcp() -> FastMCP:\n    constructor = inspect.signature(FastMCP)\n    kwargs: dict[str, Any] = {}\n    if "host" in constructor.parameters:\n        kwargs["host"] = settings.mcp_host\n    if "port" in constructor.parameters:\n        kwargs["port"] = settings.mcp_port\n    return FastMCP(settings.mcp_server_name, **kwargs)\n'''
          new = '''def _build_fastmcp() -> FastMCP:\n    constructor = inspect.signature(FastMCP)\n    accepts_kwargs = any(\n        parameter.kind is inspect.Parameter.VAR_KEYWORD\n        for parameter in constructor.parameters.values()\n    )\n    kwargs: dict[str, Any] = {}\n    if "host" in constructor.parameters or accepts_kwargs:\n        kwargs["host"] = settings.mcp_host\n    if "port" in constructor.parameters or accepts_kwargs:\n        kwargs["port"] = settings.mcp_port\n    return FastMCP(settings.mcp_server_name, **kwargs)\n'''
          if old in text:
              text = text.replace(old, new, 1)
          old_run = '''    run_signature = inspect.signature(mcp.run)\n    kwargs: dict[str, Any] = {}\n    if "transport" in run_signature.parameters:\n        kwargs["transport"] = transport\n    mcp.run(**kwargs)\n'''
          new_run = '''    run_signature = inspect.signature(mcp.run)\n    accepts_kwargs = any(\n        parameter.kind is inspect.Parameter.VAR_KEYWORD\n        for parameter in run_signature.parameters.values()\n    )\n    kwargs: dict[str, Any] = {}\n    if "transport" in run_signature.parameters or accepts_kwargs:\n        kwargs["transport"] = transport\n    mcp.run(**kwargs)\n'''
          if old_run in text:
              text = text.replace(old_run, new_run, 1)
          server.write_text(text, encoding='utf-8')

          test_path = root / 'tests/test_mcp_governance.py'
          test_path.write_text('''from __future__ import annotations\n\nfrom ukb.config import Settings\nfrom ukb.mcp import server as mcp_server\nfrom ukb.models import Sensitivity\n\n\ndef test_mcp_principal_is_configured_and_least_privilege(monkeypatch) -> None:\n    configured = Settings(\n        mcp_subject="talk2data-mcp",\n        mcp_tenant_id="tenant-blue",\n        mcp_roles="consumer,submitter",\n        mcp_clearance="confidential",\n        mcp_allow_cache_invalidation=False,\n        mcp_allow_approval=False,\n        mcp_allow_publication=False,\n    )\n    monkeypatch.setattr(mcp_server, "settings", configured)\n\n    principal = mcp_server.get_mcp_principal()\n    assert principal.subject == "talk2data-mcp"\n    assert principal.tenant_id == "tenant-blue"\n    assert principal.roles == frozenset({"consumer", "submitter"})\n    assert principal.clearance == Sensitivity.confidential\n    assert "reviewer" not in principal.roles\n    assert "publisher" not in principal.roles\n\n\ndef test_mcp_mutations_fail_closed_by_configuration() -> None:\n    configured = Settings()\n    assert configured.mcp_allow_cache_invalidation is False\n    assert configured.mcp_allow_approval is False\n    assert configured.mcp_allow_publication is False\n''', encoding='utf-8')

          ui_workflow = root / '.github/workflows/ui-check.yml'
          if ui_workflow.exists():
              text = ui_workflow.read_text(encoding='utf-8')
              text = text.replace(
                  "await ingest.getByRole('button', { name: 'Continue to governance →' }).click();",
                  "await ingest.getByRole('button', { name: /Validate source →|Continue to governance →/ }).click();",
              )
              text = text.replace(
                  "await ingest.getByRole('heading', { name: 'Bring trusted context into the brain.' }).waitFor();",
                  "await ingest.getByRole('heading', { name: 'Bring trusted context into the brain.' }).waitFor();\n            await ingest.locator('.ingestion-channel-guide').waitFor();",
                  1,
              )
              ui_workflow.write_text(text, encoding='utf-8')

          studio = root / 'apps/web/src/components/workspace/IngestionStudio.tsx'
          if studio.exists():
              text = studio.read_text(encoding='utf-8')
              # Ensure the button carrying the new label is the control that skips optional governance.
              label = 'Validate source →'
              index = text.find(label)
              if index >= 0:
                  start = max(0, index - 600)
                  segment = text[start:index]
                  last = segment.rfind('setStudioStep("governance")')
                  if last >= 0:
                      absolute = start + last
                      text = text[:absolute] + 'setStudioStep("validate")' + text[absolute + len('setStudioStep("governance")'):]
              studio.write_text(text, encoding='utf-8')
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install and normalize
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp,search]"
          ruff check --select E4,E7,E9,F --fix src tests scripts
          ruff format src/ukb/governed_runtime src/ukb/mcp tests/test_governed_runtime.py tests/test_mcp_governance.py scripts/validate_mcp_transport.py

      - name: Run complete backend validation
        env:
          UKB_AI_PROVIDER: noop
          UKB_AI_MODE: offline_no_model
          UKB_SEARCH_BACKEND: memory
          UKB_CACHE_BACKEND: memory
          UKB_CONVERSATION_STORE_BACKEND: memory
        run: |
          rm -f .ukb/v07-repair.db
          mkdir -p .ukb
          UKB_STORE_BACKEND=sqlalchemy UKB_DATABASE_URL=sqlite+pysqlite:///./.ukb/v07-repair.db alembic upgrade head
          ruff check --select E4,E7,E9,F src tests scripts
          mypy src/ukb
          pytest -q --cov=ukb --cov-report=term-missing --cov-report=xml:coverage.xml
          python -m compileall -q src tests scripts

      - name: Build frontend and validate Compose
        run: |
          npm install --no-audit --no-fund
          npm run web:build
          cp -n .env.example .env || true
          docker compose config > /tmp/local-compose.yml
          docker compose -f deploy/docker-compose.production.yml config > /tmp/production-compose.yml
          docker compose -f deploy/docker-compose.mcp.yml config > /tmp/mcp-compose.yml

      - name: Remove all temporary helpers
        run: |
          git rm -f scripts/finish_v07_patch.py || true
          git rm -f .github/workflows/apply-v07-runtime.yml || true
          git rm -f .github/workflows/finalize-v07-runtime.yml || true
          git rm -f .github/workflows/export-v07-source.yml || true
          git rm -f .github/workflows/repair-v07-runtime.yml

      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Harden governed MCP transport and source intake v0.7"
          git pull --rebase origin ${{ github.head_ref || github.ref_name }}
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
