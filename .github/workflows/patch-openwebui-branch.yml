name: Apply OpenWebUI branch patch

on:
  push:
    branches: ["agent/openwebui-adapted-interface-v0.6"]
    paths: [".github/workflows/patch-openwebui-branch.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/openwebui-adapted-interface-v0.6
          fetch-depth: 0
      - name: Narrow the context-pack value before appending the assistant message
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/web/src/components/OpenWebUIBrainApp.tsx")
          content = path.read_text()
          old = '''  useEffect(() => {
              if (!pendingQuestion || !brain.contextPack || brain.contextPack.question !== pendingQuestion) return;
              setMessages((current) => [
                ...current,
                {
                  id: messageId("assistant"),
                  role: "assistant",
                  content: brain.contextPack?.answer_guidance ?? "The governed context pack is ready.",
                  pack: brain.contextPack,
                  createdAt: new Date().toISOString()
                }
              ]);'''
          new = '''  useEffect(() => {
              const pack = brain.contextPack;
              if (!pendingQuestion || !pack || pack.question !== pendingQuestion) return;
              setMessages((current) => [
                ...current,
                {
                  id: messageId("assistant"),
                  role: "assistant",
                  content: pack.answer_guidance || "The governed context pack is ready.",
                  pack,
                  createdAt: new Date().toISOString()
                }
              ]);'''
          if old not in content:
              raise SystemExit("Expected context-pack block was not found")
          path.write_text(content.replace(old, new))
          PY
      - name: Commit branch patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/OpenWebUIBrainApp.tsx
          git commit -m "Narrow context pack before rendering chat response"
          git push origin HEAD:agent/openwebui-adapted-interface-v0.6
