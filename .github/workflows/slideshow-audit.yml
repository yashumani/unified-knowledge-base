name: Audit slideshow workspace

on:
  push:
    branches: ["agent/slideshow-studio-redesign"]
    paths:
      - "apps/web/**"
      - ".github/workflows/slideshow-audit.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build current Pages bundle
        env:
          GITHUB_PAGES: "true"
        run: npm run web:build

      - name: Install Chromium audit runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start preview
        env:
          GITHUB_PAGES: "true"
        run: |
          nohup npm --workspace apps/web run preview -- --host 127.0.0.1 --port 4173 > /tmp/ukb-preview.log 2>&1 &
          for attempt in {1..40}; do
            if curl --fail --silent http://127.0.0.1:4173/unified-knowledge-base/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ukb-preview.log
          exit 1

      - name: Exercise intro, slideshow, and focused studio
        run: |
          mkdir -p slideshow-audit
          node <<'NODE'
          const fs = require('fs');
          const { chromium } = require('playwright');
          const base = 'http://127.0.0.1:4173/unified-knowledge-base/';
          const introKey = 'ai-brain-brand-reveal-v1';
          const pages = ['home','ingest','enrich','review','publish','compose','memory','activity','help'];
          const viewports = [
            ['desktop', { width: 1440, height: 1000 }],
            ['laptop', { width: 1366, height: 768 }],
            ['tablet', { width: 820, height: 1180 }],
            ['mobile', { width: 390, height: 844 }],
            ['mobile-small', { width: 320, height: 568 }]
          ];

          async function prepare(page, label, skipIntro = true) {
            const errors = [];
            page.on('pageerror', error => errors.push(`${label}: ${error.message}`));
            if (skipIntro) {
              await page.addInitScript(key => sessionStorage.setItem(key, 'seen'), introKey);
            }
            await page.route('http://localhost:8000/**', route => route.abort());
            await page.route('http://127.0.0.1:8000/**', route => route.abort());
            return errors;
          }

          async function inspect(page, label, expectedPage) {
            const result = await page.evaluate(expected => {
              const shell = document.querySelector('.workspace-shell');
              const activeScenes = [...document.querySelectorAll('.workspace-scene')]
                .filter(element => {
                  const rect = element.getBoundingClientRect();
                  const style = getComputedStyle(element);
                  return style.display !== 'none' && rect.width > 0 && rect.height > 0;
                });
              return {
                viewport: { width: innerWidth, height: innerHeight },
                document: {
                  width: document.documentElement.scrollWidth,
                  height: document.documentElement.scrollHeight
                },
                body: {
                  width: document.body.scrollWidth,
                  height: document.body.scrollHeight,
                  overflow: getComputedStyle(document.body).overflow
                },
                scrollY,
                shellPosition: shell ? getComputedStyle(shell).position : null,
                currentPage: activeScenes[0]?.getAttribute('data-workspace-page') ?? null,
                activeScenes: activeScenes.length,
                workflowButtons: document.querySelectorAll('[aria-label="AI brain workflow"] button').length,
                pageButtons: document.querySelectorAll('[aria-label="Workspace pages"] button').length,
                expected
              };
            }, expectedPage);

            const failures = [];
            if (result.shellPosition !== 'fixed') failures.push('workspace shell is not fixed');
            if (result.scrollY !== 0) failures.push(`window scrolled to ${result.scrollY}`);
            if (result.document.height > result.viewport.height + 2) failures.push('document is taller than viewport');
            if (result.body.height > result.viewport.height + 2) failures.push('body is taller than viewport');
            if (result.document.width > result.viewport.width + 2) failures.push('horizontal document overflow');
            if (result.body.width > result.viewport.width + 2) failures.push('horizontal body overflow');
            if (result.activeScenes !== 1) failures.push(`expected one active scene, found ${result.activeScenes}`);
            if (result.currentPage !== expectedPage) failures.push(`expected page ${expectedPage}, found ${result.currentPage}`);
            if (result.workflowButtons !== 5) failures.push(`expected five workflow buttons, found ${result.workflowButtons}`);
            if (result.pageButtons !== 9) failures.push(`expected nine page buttons, found ${result.pageButtons}`);
            if (failures.length) throw new Error(`${label}: ${failures.join('; ')}\n${JSON.stringify(result, null, 2)}`);
            return result;
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const report = [];

            const intro = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            const introErrors = await prepare(intro, 'brand-reveal', false);
            await intro.goto(base, { waitUntil: 'domcontentloaded' });
            const skip = intro.getByRole('button', { name: /Skip intro/i });
            await skip.waitFor();
            await intro.waitForTimeout(950);
            await intro.screenshot({ path: 'slideshow-audit/brand-reveal.png', fullPage: false });
            await skip.click();
            await intro.getByRole('heading', { name: /Build, govern and recall AI memory/i }).waitFor();
            if (introErrors.length) throw new Error(introErrors.join('\n'));
            await intro.close();

            for (const [label, viewport] of viewports) {
              for (const pageName of pages) {
                const page = await browser.newPage({ viewport });
                const errors = await prepare(page, `${label}-${pageName}`);
                const url = pageName === 'home' ? base : `${base}?page=${pageName}`;
                await page.goto(url, { waitUntil: 'domcontentloaded' });
                await page.waitForTimeout(850);
                const geometry = await inspect(page, `${label}-${pageName}`, pageName);
                if (errors.length) throw new Error(errors.join('\n'));
                report.push({ label, page: pageName, geometry });
                await page.screenshot({ path: `slideshow-audit/${label}-${pageName}.png`, fullPage: false });
                await page.close();
              }
            }

            const keyboard = await browser.newPage({ viewport: { width: 1366, height: 768 } });
            await prepare(keyboard, 'keyboard');
            await keyboard.goto(base, { waitUntil: 'domcontentloaded' });
            await keyboard.waitForTimeout(600);
            await keyboard.keyboard.press('ArrowRight');
            await keyboard.locator('[data-workspace-page="ingest"]').waitFor();
            await keyboard.keyboard.press('ArrowLeft');
            await keyboard.locator('[data-workspace-page="home"]').waitFor();
            await keyboard.close();

            const studio = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            await prepare(studio, 'studio-e2e');
            await studio.goto(`${base}?page=ingest`, { waitUntil: 'domcontentloaded' });
            await studio.waitForTimeout(650);
            await studio.getByRole('button', { name: /Paste context/i }).click();
            await studio.getByRole('button', { name: 'Continue to governance →' }).click();
            await studio.getByRole('heading', { name: 'Governance', exact: true }).waitFor();
            await studio.getByRole('button', { name: 'Preview and validate source' }).click();
            await studio.getByText('Source manifest', { exact: true }).waitFor();
            await studio.getByRole('button', { name: 'Continue to create →' }).click();
            await studio.getByRole('heading', { name: 'Create', exact: true }).waitFor();
            await studio.getByRole('button', { name: 'Create governed review batch' }).click();
            await studio.getByText('Batch sent to human review', { exact: true }).waitFor();
            await studio.screenshot({ path: 'slideshow-audit/studio-complete.png', fullPage: false });
            await inspect(studio, 'studio-e2e', 'ingest');
            await studio.close();

            fs.writeFileSync('slideshow-audit/geometry.json', JSON.stringify(report, null, 2));
            await browser.close();
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ukb-slideshow-audit
          path: |
            apps/web/dist
            slideshow-audit
          if-no-files-found: error
          retention-days: 7

      - name: Report audit result on pull request
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ job.status }}
        shell: bash
        run: |
          if [ "$RESULT" = "success" ]; then
            gh pr comment 21 --repo "${{ github.repository }}" --body "✅ Slideshow audit passed for commit \`${{ github.sha }}\`. The production build rendered all nine scenes at desktop, laptop, tablet, 390px, and 320px widths; the document remained viewport-locked; keyboard navigation and the Source → Governance → Validate → Create studio flow completed successfully. Audit artifact: **ukb-slideshow-audit**."
          else
            gh pr comment 21 --repo "${{ github.repository }}" --body "❌ Slideshow audit failed for commit \`${{ github.sha }}\`. Inspect workflow run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} and the **ukb-slideshow-audit** artifact."
          fi
