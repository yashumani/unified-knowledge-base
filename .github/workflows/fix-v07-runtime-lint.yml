name: Finalize v0.7 runtime metadata and lint

on:
  pull_request:
    paths:
      - ".github/workflows/fix-v07-runtime-lint.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout v0.7 branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply deterministic fixes
        run: |
          python <<'PY'
          from pathlib import Path

          service = Path('src/ukb/governed_runtime/service.py')
          text = service.read_text(encoding='utf-8')
          text = text.replace('\nimport hashlib\n', '\n', 1)
          text = text.replace('from typing import Any\n', 'from typing import Any, cast\n', 1)
          text = text.replace(
              'from ukb.governed_runtime.cache import CacheCoordinator, canonical_json, digest_payload',
              'from ukb.governed_runtime.cache import CacheCoordinator, digest_payload',
              1,
          )
          text = text.replace(
              '            return value.values()\n',
              '            return cast(Iterable[Any], value.values())\n',
              1,
          )
          service.write_text(text, encoding='utf-8')

          conversations = Path('src/ukb/governed_runtime/conversations.py')
          text = conversations.read_text(encoding='utf-8')
          if 'import builtins\n' not in text:
              text = text.replace(
                  'from __future__ import annotations\n\n',
                  'from __future__ import annotations\n\nimport builtins\n',
                  1,
              )
          text = text.replace('list[', 'builtins.list[')
          conversations.write_text(text, encoding='utf-8')

          pyproject = Path('pyproject.toml')
          text = pyproject.read_text(encoding='utf-8')
          text = text.replace('version = "0.6.0"', 'version = "0.7.0"', 1)
          if '"redis>=5.0.0"' not in text:
              anchor = '  "httpx>=0.27.0",\n'
              if anchor not in text:
                  raise SystemExit('pyproject dependency anchor missing')
              text = text.replace(anchor, anchor + '  "redis>=5.0.0",\n', 1)
          pyproject.write_text(text, encoding='utf-8')

          package_init = Path('src/ukb/__init__.py')
          text = package_init.read_text(encoding='utf-8')
          text = text.replace('__version__ = "0.6.0"', '__version__ = "0.7.0"', 1)
          package_init.write_text(text, encoding='utf-8')
          PY

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate complete Python runtime
        env:
          UKB_AI_PROVIDER: noop
          UKB_AI_MODE: offline_no_model
          UKB_SEARCH_BACKEND: memory
          UKB_CACHE_BACKEND: memory
          UKB_CONVERSATION_STORE_BACKEND: memory
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp,search]"
          ruff check --select E4,E7,E9,F src tests scripts/validate_mcp_transport.py
          mypy src/ukb
          pytest -q
          python -m compileall -q src tests scripts

      - name: Remove one-shot workflow and commit
        run: |
          git rm -f .github/workflows/fix-v07-runtime-lint.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize governed runtime v0.7 metadata and types"
          git push origin HEAD:${{ github.head_ref }}
