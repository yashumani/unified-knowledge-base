name: Finalize governed runtime v0.7

on:
  pull_request:
    paths:
      - ".github/workflows/finalize-v07-runtime.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  finalize:
    if: github.event_name == 'workflow_dispatch' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest development branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Apply remaining integration patch
        run: |
          if [ -f scripts/finish_v07_patch.py ]; then
            python scripts/finish_v07_patch.py
          fi

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp,search]"

      - name: Normalize Python imports and formatting
        run: |
          ruff check --select E4,E7,E9,F --fix src tests scripts
          ruff format src/ukb/governed_runtime src/ukb/mcp tests/test_governed_runtime.py tests/test_mcp_governance.py scripts/validate_mcp_transport.py

      - name: Validate SQL migration and complete Python suite
        env:
          UKB_AI_PROVIDER: noop
          UKB_AI_MODE: offline_no_model
          UKB_SEARCH_BACKEND: memory
          UKB_CACHE_BACKEND: memory
          UKB_CONVERSATION_STORE_BACKEND: memory
        run: |
          rm -f .ukb/v07-final.db
          mkdir -p .ukb
          UKB_STORE_BACKEND=sqlalchemy \
          UKB_DATABASE_URL=sqlite+pysqlite:///./.ukb/v07-final.db \
          alembic upgrade head
          ruff check --select E4,E7,E9,F src tests scripts
          mypy src/ukb
          pytest -q --cov=ukb --cov-report=term-missing --cov-report=xml:coverage.xml
          python -m compileall -q src tests scripts

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Open WebUI-adapted frontend
        run: |
          npm install --no-audit --no-fund
          npm run web:build

      - name: Validate all Compose contracts
        run: |
          cp -n .env.example .env || true
          docker compose config > /tmp/local-compose.yml
          docker compose -f deploy/docker-compose.production.yml config > /tmp/production-compose.yml
          docker compose -f deploy/docker-compose.mcp.yml config > /tmp/mcp-compose.yml

      - name: Remove temporary development helpers
        run: |
          git rm -f scripts/finish_v07_patch.py || true
          git rm -f .github/workflows/apply-v07-runtime.yml || true
          git rm -f .github/workflows/export-v07-source.yml || true
          git rm -f .github/workflows/finalize-v07-runtime.yml

      - name: Commit remotely tested implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Finalize governed runtime caching and MCP delivery v0.7"
          git pull --rebase origin ${{ github.head_ref || github.ref_name }}
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
