name: Update slideshow UI journey tests

on:
  push:
    branches:
      - agent/slideshow-studio-live
    paths:
      - ".github/workflows/update-slideshow-ui-tests.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: agent/slideshow-studio-live

      - name: Follow the four-step ingestion studio in browser tests
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ui-check.yml')
          content = path.read_text()
          old_workspace = """            await workspace.getByRole('button', { name: /Paste context/ }).click();
                      await workspace.getByRole('button', { name: 'Preview and validate source' }).click();
                      await workspace.getByText('Source manifest', { exact: true }).waitFor();
                      await workspace.getByRole('button', { name: 'Create governed review batch' }).click();
          """
          new_workspace = """            await workspace.getByRole('button', { name: /Paste context/ }).click();
                      await workspace.getByRole('button', { name: 'Continue to governance →' }).click();
                      await workspace.getByRole('button', { name: 'Preview and validate source' }).click();
                      await workspace.getByText('Source manifest', { exact: true }).waitFor();
                      await workspace.getByRole('button', { name: 'Continue to create →' }).click();
                      await workspace.getByRole('button', { name: 'Create governed review batch' }).click();
          """
          old_crawl = """            await crawl.getByRole('button', { name: /Crawl4AI/ }).click();
                      await crawl.getByRole('button', { name: 'Preview and validate source' }).click();
          """
          new_crawl = """            await crawl.getByRole('button', { name: /Crawl4AI/ }).click();
                      await crawl.getByRole('button', { name: 'Continue to governance →' }).click();
                      await crawl.getByRole('button', { name: 'Preview and validate source' }).click();
          """
          if old_workspace not in content or old_crawl not in content:
              raise SystemExit('Expected legacy studio journey was not found')
          content = content.replace(old_workspace, new_workspace).replace(old_crawl, new_crawl)
          path.write_text(content)
          PY

          rm .github/workflows/update-slideshow-ui-tests.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update UI checks for the four-step studio"
          git push origin HEAD:agent/slideshow-studio-live
