name: Export slideshow source

on:
  push:
    branches:
      - agent/slideshow-studio-redesign
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Create source archive
        run: |
          # Export the exact branch head used by the slideshow release.
          tar --exclude=.git --exclude=node_modules --exclude='*.tar.gz' -czf /tmp/ukb-slideshow-source.tar.gz .
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: ukb-slideshow-source
          path: /tmp/ukb-slideshow-source.tar.gz
          retention-days: 1
