name: Validate React UI

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ui-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check and build GitHub Pages UI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build React UI for GitHub Pages
        env:
          GITHUB_PAGES: "true"
        run: npm run web:build

      - name: Upload rendered bundle for review
        uses: actions/upload-artifact@v4
        with:
          name: ukb-editorial-ui
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7
