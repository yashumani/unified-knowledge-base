name: Validate React UI

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ui-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check, render, and test guided + advanced UI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build React UI for GitHub Pages
        env:
          GITHUB_PAGES: "true"
        run: npm run web:build

      - name: Install browser smoke-test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start GitHub Pages preview
        env:
          GITHUB_PAGES: "true"
        run: |
          nohup npm --workspace apps/web run preview -- --host 127.0.0.1 --port 4173 > /tmp/ukb-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/unified-knowledge-base/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ukb-preview.log
          exit 1

      - name: Render and exercise guided and advanced experiences
        run: |
          mkdir -p ui-screenshots
          node <<'NODE'
          const { chromium } = require('playwright');

          const baseUrl = 'http://127.0.0.1:4173/unified-knowledge-base/';
          const configurations = [
            {
              name: 'guided-desktop',
              url: baseUrl,
              viewport: { width: 1440, height: 1000 },
              heading: 'three steps',
              landmarks: ['#guided-workflow']
            },
            {
              name: 'guided-mobile',
              url: baseUrl,
              viewport: { width: 390, height: 844 },
              heading: 'three steps',
              landmarks: ['#guided-workflow']
            },
            {
              name: 'advanced-desktop',
              url: `${baseUrl}?view=advanced`,
              viewport: { width: 1440, height: 1000 },
              heading: 'right memory',
              landmarks: ['#pipeline', '#brain-map', '#questions']
            },
            {
              name: 'advanced-mobile',
              url: `${baseUrl}?view=advanced`,
              viewport: { width: 390, height: 844 },
              heading: 'right memory',
              landmarks: ['#pipeline', '#brain-map', '#questions']
            }
          ];

          async function assertNoOverflow(page, name) {
            const overflow = await page.evaluate(() => ({
              viewport: window.innerWidth,
              document: document.documentElement.scrollWidth,
              offenders: Array.from(document.querySelectorAll('body *'))
                .map(element => {
                  const rect = element.getBoundingClientRect();
                  return {
                    tag: element.tagName.toLowerCase(),
                    className: typeof element.className === 'string' ? element.className : '',
                    text: (element.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 90),
                    left: Math.round(rect.left),
                    right: Math.round(rect.right),
                    width: Math.round(rect.width),
                    excess: Math.max(0, Math.round(rect.right - window.innerWidth))
                  };
                })
                .filter(item => item.right > window.innerWidth + 1 || item.left < -1)
                .sort((a, b) => b.excess - a.excess)
                .slice(0, 12)
            }));

            if (overflow.document > overflow.viewport + 2) {
              throw new Error(
                `${name}: horizontal overflow ${overflow.document}px > ${overflow.viewport}px\n` +
                JSON.stringify(overflow.offenders, null, 2)
              );
            }
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const pageErrors = [];

            for (const configuration of configurations) {
              const page = await browser.newPage({ viewport: configuration.viewport });
              page.on('pageerror', error => pageErrors.push(`${configuration.name}: ${error.message}`));
              await page.route('http://localhost:8000/**', route => route.abort());
              await page.route('http://127.0.0.1:8000/**', route => route.abort());
              await page.goto(configuration.url, { waitUntil: 'domcontentloaded' });
              await page.waitForTimeout(2500);

              const heading = await page.locator('h1').innerText();
              if (!heading.toLowerCase().includes(configuration.heading)) {
                throw new Error(`${configuration.name}: unexpected hero heading: ${heading}`);
              }

              for (const selector of configuration.landmarks) {
                if (await page.locator(selector).count() !== 1) {
                  throw new Error(`${configuration.name}: missing landmark ${selector}`);
                }
              }

              await assertNoOverflow(page, configuration.name);
              await page.screenshot({
                path: `ui-screenshots/${configuration.name}-hero.png`,
                fullPage: false
              });
              await page.screenshot({
                path: `ui-screenshots/${configuration.name}-full-page.png`,
                fullPage: true
              });
              await page.close();
            }

            // Exercise the default three-decision path in browser demo mode.
            const guided = await browser.newPage({ viewport: { width: 1280, height: 900 } });
            guided.on('pageerror', error => pageErrors.push(`guided-e2e: ${error.message}`));
            await guided.route('http://localhost:8000/**', route => route.abort());
            await guided.route('http://127.0.0.1:8000/**', route => route.abort());
            await guided.goto(baseUrl, { waitUntil: 'domcontentloaded' });
            await guided.waitForTimeout(2500);

            await guided.getByRole('button', { name: 'Create review candidate' }).click();
            await guided.getByRole('heading', { name: 'Approve what the AI may remember' }).waitFor();
            await guided.getByRole('button', { name: 'Approve and publish this memory' }).click();
            await guided.getByRole('button', { name: 'Yes, publish it' }).click();
            await guided.getByRole('heading', { name: 'Ask the approved brain' }).waitFor();
            await guided.getByRole('button', { name: 'Build the context pack' }).click();
            await guided.getByRole('heading', {
              name: 'The AI receives governed context—not a pile of files.'
            }).waitFor();

            if (await guided.getByText('Evidence used').count() !== 1) {
              throw new Error('guided-e2e: the result did not expose its evidence section');
            }
            await assertNoOverflow(guided, 'guided-e2e');
            await guided.screenshot({ path: 'ui-screenshots/guided-complete.png', fullPage: true });
            await guided.close();

            await browser.close();
            if (pageErrors.length) throw new Error(pageErrors.join('\n'));
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload rendered bundle and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ukb-guided-and-advanced-ui
          path: |
            apps/web/dist
            ui-screenshots
          if-no-files-found: error
          retention-days: 7
