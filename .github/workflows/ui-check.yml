name: Validate React UI

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/ui-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Type-check, render, and test OpenWebUI-adapted AI Brain
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build React UI for GitHub Pages
        env:
          GITHUB_PAGES: "true"
        run: npm run web:build

      - name: Install browser smoke-test runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Start GitHub Pages preview
        env:
          GITHUB_PAGES: "true"
        run: |
          nohup npm --workspace apps/web run preview -- --host 127.0.0.1 --port 4173 > /tmp/ukb-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4173/unified-knowledge-base/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/ukb-preview.log
          exit 1

      - name: Exercise chat, governance, desktop, and mobile journeys
        run: |
          mkdir -p ui-screenshots
          node <<'NODE'
          const { chromium } = require('playwright');

          const baseUrl = 'http://127.0.0.1:4173/unified-knowledge-base/';
          const pageErrors = [];

          async function prepare(page, label) {
            page.on('pageerror', error => pageErrors.push(`${label}: ${error.message}`));
            await page.route('http://localhost:8000/**', route => route.abort());
            await page.route('http://127.0.0.1:8000/**', route => route.abort());
          }

          async function assertNoOverflow(page, name) {
            const overflow = await page.evaluate(() => ({
              viewport: window.innerWidth,
              document: document.documentElement.scrollWidth,
              offenders: Array.from(document.querySelectorAll('body *'))
                .map(element => {
                  const rect = element.getBoundingClientRect();
                  return {
                    tag: element.tagName.toLowerCase(),
                    className: typeof element.className === 'string' ? element.className : '',
                    text: (element.textContent || '').trim().replace(/\s+/g, ' ').slice(0, 80),
                    left: Math.round(rect.left),
                    right: Math.round(rect.right),
                    width: Math.round(rect.width),
                    excess: Math.max(0, Math.round(rect.right - window.innerWidth))
                  };
                })
                .filter(item => item.right > window.innerWidth + 2 || item.left < -2)
                .sort((a, b) => b.excess - a.excess)
                .slice(0, 12)
            }));
            if (overflow.document > overflow.viewport + 2) {
              throw new Error(`${name}: horizontal overflow ${overflow.document}px > ${overflow.viewport}px\n${JSON.stringify(overflow.offenders, null, 2)}`);
            }
          }

          async function validateShell(page, name, heading) {
            await page.waitForSelector('.owui-shell');
            const text = await page.locator('h1').first().innerText();
            if (!text.toLowerCase().includes(heading)) {
              throw new Error(`${name}: unexpected heading ${text}`);
            }
            for (const selector of ['.owui-sidebar', '.owui-center-column', '.owui-topbar']) {
              if (await page.locator(selector).count() !== 1) throw new Error(`${name}: missing ${selector}`);
            }
            await assertNoOverflow(page, name);
          }

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const configurations = [
              { name: 'brain-chat-desktop', url: baseUrl, viewport: { width: 1440, height: 1000 }, heading: 'what should the ai brain understand' },
              { name: 'brain-chat-mobile', url: baseUrl, viewport: { width: 390, height: 844 }, heading: 'what should the ai brain understand' },
              { name: 'sources-desktop', url: `${baseUrl}?section=sources`, viewport: { width: 1440, height: 1000 }, heading: 'bring trusted context into the brain' },
              { name: 'sources-mobile', url: `${baseUrl}?section=sources`, viewport: { width: 390, height: 844 }, heading: 'bring trusted context into the brain' },
              { name: 'operations-desktop', url: `${baseUrl}?view=operations`, viewport: { width: 1440, height: 1000 }, heading: 'operate the knowledge supply chain' },
              { name: 'operations-mobile', url: `${baseUrl}?view=operations`, viewport: { width: 390, height: 844 }, heading: 'operate the knowledge supply chain' }
            ];

            for (const configuration of configurations) {
              const page = await browser.newPage({ viewport: configuration.viewport });
              await prepare(page, configuration.name);
              await page.goto(configuration.url, { waitUntil: 'domcontentloaded' });
              await page.waitForTimeout(2200);
              await validateShell(page, configuration.name, configuration.heading);
              await page.screenshot({ path: `ui-screenshots/${configuration.name}.png`, fullPage: false });
              await page.close();
            }

            const chat = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            await prepare(chat, 'brain-chat-e2e');
            await chat.goto(baseUrl, { waitUntil: 'domcontentloaded' });
            await chat.waitForTimeout(2200);
            const composer = chat.getByLabel('Ask the governed AI Brain');
            await composer.fill('What does Incident Resolution Time mean and which approved sources define it?');
            await composer.press('Enter');
            await chat.locator('.owui-message.is-assistant .owui-pack-summary').waitFor({ timeout: 15000 });
            await chat.getByText('approved objects', { exact: true }).first().waitFor();
            await assertNoOverflow(chat, 'brain-chat-e2e');
            await chat.screenshot({ path: 'ui-screenshots/brain-chat-context-pack.png', fullPage: false });
            await chat.close();

            const ingest = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            await prepare(ingest, 'governed-ingestion-e2e');
            await ingest.goto(baseUrl, { waitUntil: 'domcontentloaded' });
            await ingest.waitForTimeout(2200);
            await ingest.getByRole('button', { name: /^Sources/ }).click();
            await ingest.getByRole('heading', { name: 'Bring trusted context into the brain.' }).waitFor();
            await ingest.getByRole('button', { name: /Paste context/ }).click();
            await ingest.getByRole('button', { name: 'Continue to governance →' }).click();
            await ingest.getByRole('button', { name: 'Preview and validate source' }).click();
            await ingest.getByText('Source manifest', { exact: true }).waitFor();
            await ingest.getByRole('button', { name: 'Continue to create →' }).click();
            await ingest.getByRole('button', { name: 'Create governed review batch' }).click();
            await ingest.getByText('Batch sent to human review', { exact: true }).waitFor();
            await assertNoOverflow(ingest, 'governed-ingestion-e2e');
            await ingest.screenshot({ path: 'ui-screenshots/governed-ingestion-complete.png', fullPage: false });
            await ingest.close();

            const mobile = await browser.newPage({ viewport: { width: 390, height: 844 } });
            await prepare(mobile, 'mobile-drawers');
            await mobile.goto(baseUrl, { waitUntil: 'domcontentloaded' });
            await mobile.waitForTimeout(2200);
            await mobile.getByRole('button', { name: 'Open navigation' }).click();
            await mobile.locator('.owui-sidebar').waitFor();
            const transform = await mobile.locator('.owui-sidebar').evaluate(el => getComputedStyle(el).transform);
            if (transform === 'none') {
              const box = await mobile.locator('.owui-sidebar').boundingBox();
              if (!box || box.x < -2) throw new Error('Mobile sidebar did not open.');
            }
            await mobile.getByRole('button', { name: /^Sources/ }).click();
            await mobile.getByRole('heading', { name: 'Bring trusted context into the brain.' }).waitFor();
            await assertNoOverflow(mobile, 'mobile-drawers');
            await mobile.screenshot({ path: 'ui-screenshots/mobile-sources.png', fullPage: false });
            await mobile.close();

            const guided = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            await prepare(guided, 'guided-regression');
            await guided.goto(`${baseUrl}?view=guided`, { waitUntil: 'domcontentloaded' });
            await guided.waitForTimeout(1800);
            if (!(await guided.locator('#guided-workflow').count())) throw new Error('Guided experience missing.');
            await assertNoOverflow(guided, 'guided-regression');
            await guided.close();

            const advanced = await browser.newPage({ viewport: { width: 1440, height: 1000 } });
            await prepare(advanced, 'advanced-regression');
            await advanced.goto(`${baseUrl}?view=advanced`, { waitUntil: 'domcontentloaded' });
            await advanced.waitForTimeout(1800);
            for (const selector of ['#pipeline', '#brain-map', '#questions']) {
              if (!(await advanced.locator(selector).count())) throw new Error(`Advanced experience missing ${selector}.`);
            }
            await assertNoOverflow(advanced, 'advanced-regression');
            await advanced.close();

            await browser.close();
            if (pageErrors.length) throw new Error(`Page errors:\n${pageErrors.join('\n')}`);
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Upload rendered bundle and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openwebui-adapted-ui
          path: |
            apps/web/dist
            ui-screenshots
