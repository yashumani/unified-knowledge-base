# Manual fallback for static React UI deployment.
# Push-to-main deployments are owned by release.yml so the exact release commit
# is tested, the API image is published, Pages is smoke-tested, and evidence is
# written to the deployment ledger.
name: Deploy React UI to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build React UI
        env:
          GITHUB_PAGES: "true"
          VITE_UKB_API_BASE_URL: ${{ vars.UKB_API_BASE_URL }}
        run: npm run web:build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
