name: Apply OpenWebUI mobile default patch

on:
  pull_request:
    branches: ["main"]
    paths: [".github/workflows/patch-openwebui-mobile-default.yml"]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/openwebui-adapted-interface-v0.6'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/openwebui-adapted-interface-v0.6
          fetch-depth: 0
      - name: Keep mobile Brain Chat unobstructed on first load
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("apps/web/src/components/OpenWebUIBrainApp.tsx")
          content = path.read_text()
          old = '  const [contextOpen, setContextOpen] = useState(true);'
          new = '''  const [contextOpen, setContextOpen] = useState(() =>
              typeof window === "undefined" ? true : window.innerWidth > 1020
            );'''
          if old not in content:
              raise SystemExit("Expected context panel state was not found")
          path.write_text(content.replace(old, new))
          PY
      - name: Commit the patch and remove this one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/components/OpenWebUIBrainApp.tsx
          git rm .github/workflows/patch-openwebui-mobile-default.yml
          git commit -m "Keep mobile Brain Chat unobstructed by default"
          git push origin HEAD:agent/openwebui-adapted-interface-v0.6
