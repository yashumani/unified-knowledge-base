name: Apply reconciled slideshow studio

on:
  push:
    branches:
      - agent/slideshow-studio-live
    paths:
      - ".github/workflows/apply-slideshow-studio-live.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out current production branch
        uses: actions/checkout@v4
        with:
          ref: agent/slideshow-studio-live
          fetch-depth: 0

      - name: Fetch the validated slideshow design branch
        run: git fetch origin agent/slideshow-studio-redesign:refs/remotes/origin/agent/slideshow-studio-redesign

      - name: Apply the validated UI layer
        shell: bash
        env:
          DESIGN_REF: origin/agent/slideshow-studio-redesign
        run: |
          set -euo pipefail
          files=(
            apps/web/index.html
            apps/web/src/RootApp.tsx
            apps/web/src/main.tsx
            apps/web/src/components/workspace/WorkspaceApp.tsx
            apps/web/src/components/workspace/DashboardHome.tsx
            apps/web/src/components/workspace/IngestionStudio.tsx
            apps/web/src/styles/workspace.css
            apps/web/public/ai-brain-mark.svg
            apps/web/src/components/BrandReveal.tsx
            apps/web/src/styles/brand-reveal.css
          )

          for path in "${files[@]}"; do
            mkdir -p "$(dirname "${path}")"
            git show "${DESIGN_REF}:${path}" > "${path}"
          done

          if grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' apps/web; then
            echo "Merge markers remain in the UI source." >&2
            exit 1
          fi

          grep -q 'approvedItems={brain.approvedItems}' apps/web/src/components/workspace/WorkspaceApp.tsx
          grep -q 'onPublish={brain.publishReview}' apps/web/src/components/workspace/WorkspaceApp.tsx
          grep -q 'onRevise={brain.reviseReview}' apps/web/src/components/workspace/WorkspaceApp.tsx
          grep -q 'getIngestionCapabilities' apps/web/src/components/workspace/IngestionStudio.tsx
          grep -q 'BrandReveal' apps/web/src/RootApp.tsx

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install web dependencies
        run: npm install --no-audit --no-fund

      - name: Build the production React application
        env:
          GITHUB_PAGES: "true"
        run: npm run web:build

      - name: Commit the reconciled release
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-slideshow-studio-live.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Deploy fixed slideshow studio and AI Brain reveal"
          git push origin HEAD:agent/slideshow-studio-live
