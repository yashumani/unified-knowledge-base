name: Validate Talk2Data operations

on:
  pull_request:
    paths:
      - "src/ukb/talk2data/**"
      - "scripts/talk2data_*.py"
      - "scripts/backfill_talk2data_memory.py"
      - "scripts/validate_graphiti_runtime.py"
      - "tests/test_talk2data_*.py"
      - "pyproject.toml"
      - ".github/workflows/talk2data-operations.yml"
  workflow_dispatch:
    inputs:
      scale_profile:
        description: "Scale profile to run"
        type: choice
        required: true
        default: ci
        options:
          - ci
          - full

permissions:
  contents: read

jobs:
  governed-memory-operations:
    name: Client, backfill, and scale validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      UKB_AI_MODE: offline_no_model
      UKB_AI_PROVIDER: noop
      UKB_SEARCH_BACKEND: memory
      UKB_STORE_BACKEND: memory

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp,search]"

      - name: Lint and type-check
        run: |
          ruff check --select E4,E7,E9,F \
            src/ukb/talk2data \
            scripts/talk2data_integration_harness.py \
            scripts/talk2data_scale_test.py \
            scripts/backfill_talk2data_memory.py \
            tests/test_talk2data_client_orchestrator.py \
            tests/test_talk2data_backfill.py \
            tests/test_talk2data_scale.py
          mypy src/ukb

      - name: Run focused operations tests
        run: |
          pytest -q \
            tests/test_talk2data_client_orchestrator.py \
            tests/test_talk2data_backfill.py \
            tests/test_talk2data_scale.py

      - name: Run CI scale and isolation profile
        if: github.event_name == 'pull_request' || inputs.scale_profile == 'ci'
        run: python scripts/talk2data_scale_test.py --profile ci --max-p95-ms 1500

      - name: Run full 5,000-source / 100,000-memory profile
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.scale_profile == 'full') ||
          (github.event_name == 'pull_request' &&
           github.head_ref == 'agent/talk2data-integration-operations')
        run: python scripts/talk2data_scale_test.py --profile full --max-p95-ms 5000

  graphiti-neo4j-smoke:
    name: Graphiti 0.29.3 with Neo4j 5.26
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/ukbgraphiti123
        ports:
          - 7474:7474
          - 7687:7687

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pinned Graphiti integration
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[graphiti]"
          python -c "from importlib.metadata import version; assert version('graphiti-core') == '0.29.3'"

      - name: Wait for Neo4j
        env:
          NEO4J_CONTAINER: ${{ job.services.neo4j.id }}
        run: |
          for attempt in {1..60}; do
            if docker exec "$NEO4J_CONTAINER" cypher-shell \
              -u neo4j -p ukbgraphiti123 "RETURN 1 AS ready" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 2
          done
          docker logs "$NEO4J_CONTAINER"
          exit 1

      - name: Initialize Graphiti schema and run live probe
        env:
          NEO4J_URI: bolt://127.0.0.1:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: ukbgraphiti123
          OPENAI_API_KEY: graphiti-smoke-not-used
        run: |
          python scripts/validate_graphiti_runtime.py --expect-version 0.29.3
          python scripts/validate_graphiti_runtime.py --expect-version 0.29.3
