# Build and publish the Unified Knowledge Base API image to GitHub Container Registry.
# This workflow is manual/tag-driven by design so normal docs/UI commits do not publish runtime images accidentally.
name: Publish UKB API image to GHCR

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional image tag. Defaults to the commit SHA."
        required: false
        type: string
  push:
    tags:
      - "ukb-api-v*"

permissions:
  contents: read
  packages: write

jobs:
  build-and-push-api:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/unified-knowledge-base-api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Resolve image tags
        id: meta
        shell: bash
        run: |
          TAG="${GITHUB_SHA}"
          if [ -n "${{ inputs.image_tag }}" ]; then
            TAG="${{ inputs.image_tag }}"
          fi
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${REGISTRY}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Unified Knowledge Base API
