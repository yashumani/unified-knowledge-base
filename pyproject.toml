[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-knowledge-base"
version = "0.5.0"
description = "Governed AI Brain runtime with quality controls, reviewer operations, continuous source refresh, local Ollama enrichment, Zvec retrieval, MCP, and tenant-aware Talk2Data memory contracts."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "typer>=0.12.0",
  "PyYAML>=6.0.0",
  "httpx>=0.27.0",
  "SQLAlchemy>=2.0.36",
  "alembic>=1.14.0",
  "psycopg[binary]>=3.2.0",
  "python-multipart>=0.0.18",
  "beautifulsoup4>=4.12.0",
  "lxml>=5.3.0",
  "python-docx>=1.1.2",
  "openpyxl>=3.1.5",
  "pypdf>=5.1.0",
  "python-pptx>=1.0.2",
  "PyJWT[crypto]>=2.10.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.8.0",
  "mypy>=1.13.0",
  "types-PyYAML>=6.0.12"
]
mcp = ["mcp[cli]>=1.27,<2"]
search = ["zvec>=0.6.0,<0.7.0"]
graphiti = ["graphiti-core==0.29.3"]
all = [
  "mcp[cli]>=1.27,<2",
  "zvec>=0.6.0,<0.7.0",
  "graphiti-core==0.29.3"
]

[project.scripts]
ukb = "ukb.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
plugins = []
