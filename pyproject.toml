[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "unified-knowledge-base"
version = "0.1.0"
description = "Governed AI Brain starter platform with REST API, MCP adapter, and human review workflow."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.3.0",
  "typer>=0.12.0",
  "PyYAML>=6.0.0",
  "SQLAlchemy>=2.0.30,<3.0",
  "alembic>=1.13.0,<2.0",
  "psycopg[binary]>=3.2.0,<4.0"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27.0,<1.0",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.0",
  "mypy>=1.10.0"
]
mcp = [
  "mcp[cli]>=1.2.0"
]

[project.scripts]
ukb = "ukb.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["ukb"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
